const CATS = ['basic','input','radio','logic','vars','math','loops','led','music','func'];
function catOf(text){ const m = /^([a-z]+):\s/.exec(text); return m && CATS.includes(m[1]) ? m[1] : null; }
function valHtml(t){ return esc(t).replace(/\[([^\]]*)\]/g, (m,x)=>'<span class="v">'+x+'</span>'); }
function pseudoHtml(src){
  return src.split('\n').map(line => {
    const sp = /^ */.exec(line)[0].length; const rest = line.slice(sp);
    const cat = catOf(rest);
    const pad = 'style="padding-left:'+(sp*0.6)+'rem"';
    if (!cat) return '<div class="pl cm" '+pad+'>'+valHtml(sub(rest))+'</div>';
    const body = rest.slice(cat.length+2);
    return '<div class="pl" '+pad+'><span class="c cat-'+cat+'">'+cat+'</span>'+valHtml(sub(body))+'</div>';
  }).join('');
}

function xorDecode(b64, key){
  const bin = atob(b64); const kb = new TextEncoder().encode(key); const out = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i) ^ kb[i % kb.length];
  return new TextDecoder().decode(out);
}
function tryDecode(id, key){
  try{ const t = xorDecode(DATA.enc[id], key.trim().toLowerCase()); if (t.indexOf('OK:')!==0) return null; return JSON.parse(t.slice(3)); }catch(e){ return null; }
}

let decoded = {};
function coachHtml(p){
  let h = '<h2>🔒 Coach only: full code</h2><div class="panel lock"><p>This is the complete code for a stuck pair. In MakeCode, switch to the <strong>JavaScript</strong> tab, paste it in, then switch back to <strong>Blocks</strong>. Needs the coach code.</p>';
  const data = coachKey ? (decoded[p.id] || (decoded[p.id] = tryDecode(p.id, coachKey))) : null;
  if (data){
    h += '<p>Using radio group <strong>'+(pair||1)+'</strong>'+(pair?'':' (set your pair number above to change it)')+'.</p>'+codeBlocks(data.progs, 'm')+(data.ext && data.ext.length? '<h3>Extension code</h3>'+codeBlocks(data.ext, 'x') : '')+'<p><button class="btn small ghost" data-lock="1">Lock again</button></p>';
  } else {
    h += '<form data-unlock="'+p.id+'" class="row"><label>Coach code <input type="password" name="k" autocomplete="off" aria-label="Coach code"></label><button class="btn small" type="submit">Unlock</button><span class="err" id="lockerr" role="alert"></span></form>';
  }
  return h+'</div>';
}
// ---------- setup page ----------
function setup(){
  const S = DATA.setup;
  let h = '<p class="crumbs"><a href="#/">Home</a> › Setup &amp; troubleshooting</p><h1>Setup &amp; troubleshooting</h1>';
  h += '<div class="panel"><h3>Getting going</h3><ol>'+S.start.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></div>';
  h += '<div class="panel"><h3>Good radio habits</h3><ul>'+S.rules.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
  h += '<div class="panel"><h3>Something not working?</h3>'+S.trouble.map(t=>'<details><summary>'+esc(t[0])+'</summary><p>'+esc(t[1])+'</p></details>').join('')+'</div>';
  setMain(h);
}
function notFound(){ setMain('<h1>Page not found</h1><p><a href="#/">Back to the start</a></p>'); }
// ---------- router ----------
function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const [a, b] = h.split('/');
  if (!a) home();
  else if (a==='level') levelPage(parseInt(b,10));
  else if (a==='p') project(b);
  else if (a==='setup') setup();
  else notFound();
}
let lastHash = null;
window.addEventListener('hashchange', () => { route(); window.scrollTo(0,0); const m=$('#main'); m.focus({preventScroll:true}); });
// ---------- events ----------
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if (t.dataset.hint){ const k=t.dataset.hint; reveal[k] = Math.min(3,(reveal[k]||0)+1); keepScroll(route); return; }
  if (t.dataset.done){ const k=t.dataset.done; setProg('s:'+k, !isDone('s:'+k)); keepScroll(route); return; }
  if (t.dataset.pdone){ const k=t.dataset.pdone; setProg('p:'+k, !isDone('p:'+k)); keepScroll(route); return; }
  if (t.dataset.ext){ extReveal[t.dataset.ext]=1; keepScroll(route); return; }
  if (t.dataset.lock){ coachKey=null; decoded={}; keepScroll(route); return; }
  if (t.dataset.copy){
    const id = location.hash.split('/')[2]; const data = decoded[id]; if(!data) return;
    const kind = t.dataset.copy[0], i = +t.dataset.copy.slice(1); const code = subCode((kind==='m'? data.progs : data.ext)[i].js);
    const done = () => { t.textContent='✔ Copied'; setTimeout(()=>{ t.textContent='📋 Copy code'; }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, ()=>fallbackCopy(code, done)); else fallbackCopy(code, done);
  }
});
function fallbackCopy(text, cb){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); cb(); }catch(e){} ta.remove(); }
document.addEventListener('change', e => {
  const t = e.target; if (t.dataset && t.dataset.test){ const [id,i] = t.dataset.test.split(':'); const cur = store.get('t:'+id, []); const n = +i; const next = t.checked? cur.concat(cur.includes(n)?[]:[n]) : cur.filter(x=>x!==n); store.set('t:'+id, next); }
});
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset.unlock) return; e.preventDefault();
  const key = f.k.value; const data = tryDecode(f.dataset.unlock, key);
  if (data){ coachKey = key; decoded = {}; keepScroll(route); } else { $('#lockerr').textContent = 'That code is not right.'; }
});
route();
</script>
</body>
</html>
