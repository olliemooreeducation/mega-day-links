body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.55 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:inherit}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:.6rem 1rem;z-index:99}
.skip:focus{left:8px;top:8px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header.bar{background:var(--navy);color:#fff;position:sticky;top:0;z-index:10;border-bottom:4px solid var(--accent)}
.bar-in{max-width:1000px;margin:auto;padding:.6rem 1rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.8rem;text-decoration:none;margin-right:auto;color:#fff}
.brand img{height:2.6rem;width:auto;display:block}
.brand .sub{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;border-left:2px solid var(--accent);padding-left:.8rem}
@media (max-width:560px){.brand .sub{display:none}.brand img{height:2.2rem}}
.pairbox{display:flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.12);padding:.25rem .6rem;border-radius:999px;font-size:.9rem}
.pairbox input{width:3.6rem;font:inherit;font-weight:700;text-align:center;border-radius:8px;border:2px solid var(--accent);padding:.1rem .2rem;background:#fff;color:#0d203b}
.tbtn{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;padding:.3rem .6rem;font:inherit;cursor:pointer}
.tbtn:hover{background:rgba(255,255,255,.28)}
main:focus{outline:none}
main{max-width:1000px;margin:auto;padding:1.2rem 1rem 4rem}
h1{font-size:2rem;line-height:1.15;margin:.3rem 0 .6rem;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:1.4rem;margin:1.6rem 0 .5rem}
h3{margin:.2rem 0 .3rem}
.hero{display:flex;gap:1.5rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero img{width:min(260px,70%);height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.ph{display:flex;gap:1rem;align-items:flex-start;justify-content:space-between}
.ph img{width:110px;height:auto;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
@media (max-width:560px){.ph img{width:72px}}
.crumbs{font-size:.9rem;color:var(--muted);margin:.2rem 0}
.crumbs a{color:var(--muted)}
.lead{font-size:1.1rem;color:var(--muted);max-width:60ch}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:1rem 1.1rem;position:relative}
.card.link:hover{border-color:var(--accent);transform:translateY(-2px)}
.card.link a.stretch{text-decoration:none}
.card.link a.stretch::after{content:"";position:absolute;inset:0}
.emoji{font-size:2rem;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0}
.chip{font-size:.8rem;padding:.1rem .55rem;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chip.v2{background:var(--warnbg);color:var(--warn);border-color:transparent}
.chip.done{background:var(--okbg);color:var(--ok);border-color:transparent;font-weight:700}
.nudge{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:.7rem 1rem;margin:1rem 0}
.nudge a{font-weight:700}
.lvl{display:inline-block;background:var(--navy);color:#fff;border-radius:8px;padding:.05rem .55rem;font-weight:800;font-size:.85rem}
.dots{letter-spacing:.15em;color:var(--accent);font-weight:800}
.bigbtn,.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:.55rem 1rem;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.small{padding:.3rem .7rem;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ok{background:var(--ok);color:#fff}
.panel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:1rem 1.2rem;margin:1rem 0}
.panel h3{margin-top:0}
.three{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.step{background:var(--card);border:2px solid var(--line);border-left:8px solid var(--accent);border-radius:14px;padding:1rem 1.2rem;margin:1.1rem 0}
.step.done{border-left-color:var(--ok)}
.step .n{font-size:.85rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.prog{display:inline-block;font-size:.8rem;font-weight:700;padding:.05rem .55rem;border-radius:999px;background:var(--navy);color:#fff;margin-left:.4rem}
.try{background:var(--bg);border:2px dashed var(--accent);border-radius:10px;padding:.5rem .8rem;margin:.7rem 0;font-size:.95rem}
.check{color:var(--ok);font-size:.95rem;margin:.6rem 0}
.hintbox{margin:.6rem 0;padding:.6rem .9rem;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.hintbox h4{margin:.1rem 0 .3rem;font-size:.95rem}
.hintbox ul{margin:.2rem 0 .2rem 1.1rem;padding:0}
.blk{display:inline-block;margin:.15rem .2rem .15rem 0;padding:.12rem .55rem;border-radius:6px;font:600 .85rem ui-monospace,Consolas,monospace;color:#fff}
.pseudo{background:var(--code);color:var(--codeink);border-radius:10px;padding:.8rem 1rem;overflow:auto;font:.9rem/1.7 ui-monospace,Consolas,Menlo,monospace}
.pl{white-space:pre-wrap}
.pl .c{font-weight:800;padding:0 .35rem;border-radius:4px;margin-right:.4rem;color:#fff;font-size:.8rem}
.pl .v{background:#2d4268;color:#ffe9b8;border-radius:5px;padding:0 .3rem}
.pl.cm{color:#9fb1cc;font-style:italic}
.cat-basic{background:#1e90ff}.cat-input{background:#b100b1}.cat-radio{background:#d6246e}.cat-logic{background:#00897b}.cat-vars{background:#c62828}.cat-math{background:#7b32c8}.cat-loops{background:#2e7d32}.cat-led{background:#5c2d91}.cat-music{background:#c2185b}.cat-func{background:#5e6bd1}
.legend{display:flex;flex-wrap:wrap;gap:.3rem;margin:.4rem 0}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.ck{display:flex;gap:.6rem;align-items:flex-start;padding:.35rem 0}
.ck input{width:1.3rem;height:1.3rem;margin-top:.15rem;accent-color:var(--ok)}
.ext{border-top:1px solid var(--line);padding:.6rem 0}
.ext:first-of-type{border-top:0}
.lock input{font:inherit;padding:.4rem .6rem;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.err{color:#c62828;font-weight:700}
.codebox{position:relative;margin:.5rem 0 1rem}
.codebox pre{margin:0;background:var(--code);color:var(--codeink);border-radius:10px;padding:.8rem 1rem;overflow:auto;font:.85rem/1.5 ui-monospace,Consolas,monospace}
.codebox .btn{margin-top:.4rem}
details summary{cursor:pointer;font-weight:700}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:.4rem 0}
.progress i{display:block;height:100%;background:var(--ok)}
.toc a{display:inline-block;margin:.15rem .6rem .15rem 0}
.lvl{background:var(--lc,var(--navy))!important;color:var(--lci,#fff)!important;border:2px solid rgba(255,255,255,.4)}
.card.lv{border-top:8px solid var(--lc)}
.card.link:hover{border-color:var(--lc,var(--accent))}
.step{border-left-color:var(--lc,var(--accent))}.step.done{border-left-color:var(--ok)}
.dots{color:var(--lc,var(--accent))}
.pagehead{border-bottom:6px solid var(--lc);padding-bottom:.6rem;margin-bottom:1rem}
.pagehead h1{margin-bottom:.2rem}
.btn.lc{background:var(--lc);color:var(--lci)}
.progress i.lcbar{background:var(--lc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;transform:none!important}}
@media print{header.bar,.btn,.hintbox button{display:none}}
</style>
</head>

set group"], "pseudo": "basic: on start\n  radio: radio set group [{G}]", "check": "Nothing visible happens yet. That's fine, you will see it working in a later step."}, {"title": "Keep sending", "prog": "both", "task": "Make each micro:bit send a number again and again, forever, with a short random pause between messages.", "think": ["Which Basic block runs for ever?", "Why a random pause? If both micro:bits talked at exactly the same moment they would drown each other out."], "blocks": ["basic: forever", "radio: radio send number", "basic: pause (ms)", "math: pick random … to …"], "pseudo": "basic: forever\n  radio: radio send number [0]\n  basic: pause (ms) [pick random 300 to 500]", "check": "Nothing visible yet. Your micro:bit is quietly sending."}, {"title": "Look at the signal", "prog": "both", "task": "When a message arrives, show how strong the signal was as a number, so you can see what the numbers look like.", "think": ["Look in the Radio toolbox for a block about the 'received packet'. Which property do you want?"], "blocks": ["radio: on radio received receivedNumber", "radio: radio received packet signal strength", "basic: show number"], "pseudo": "radio: on radio received [receivedNumber]\n  basic: show number [radio received packet (signal strength)]", "check": "Numbers scroll across the screen. They are negative: around -30 is very close, around -100 is far away."}, {"title": "Draw the meter", "prog": "both", "task": "Replace the number with a bar graph. The signal is a negative number from about -128 (weak) to -28 (strong). Add 128 to turn it into a number from 0 to about 100.", "think": ["The bar graph block needs a number and a 'highest value'. What should the highest value be?", "The signal is negative. What can you add to it to make it positive?"], "blocks": ["led: plot bar graph of … up to …", "radio: radio received packet signal strength", "math: + (add)"], "pseudo": "radio: on radio received [receivedNumber]\n  led: plot bar graph of [radio received packet (signal strength) + 128] up to [100]", "check": "Walk apart: the bar shrinks. Walk closer: it grows."}], "test": ["Side by side, the bar is nearly full.", "Walking apart makes the bar shrink.", "Hold one micro:bit behind your back or inside your bag. Does the bar change?"], "extend": [{"title": "Geiger counter", "text": "Play a short beep each time a message arrives, with a pitch that gets higher as you get closer. Sound needs a V2 micro:bit.", "hint": "Use 'map' to turn the signal strength (-128 to -28) into a pitch (200 to 1000), then 'play tone' for a very short time."}, {"title": "Out of range", "text": "Walk far away. The bar freezes instead of going empty. Fix it so a cross appears if nothing has been heard for a second and a half.", "hint": "Keep a variable called lastHeard. Update it with 'running time' every time a message arrives. In a second 'forever', check how long ago that was."}, {"title": "Three zones", "text": "Show a cold, warm or hot icon depending on how strong the signal is.", "hint": "You need an if with 'else if' and two different numbers to compare the signal against."}]}, "stop-thief": {"id": "stop-thief", "level": 1, "emoji": "🚨", "title": "Stop, Thief!", "tagline": "A theft alarm made of two micro:bits.", "make": "Hide one micro:bit in a bag or on a door. If anyone shakes it, the other micro:bit sets off the alarm with a face and a beep. Both micro:bits run the same program, so shaking either one sets off the other.", "learn": "Sensor, network, alert. One device senses something, sends a message, and another device acts on it.", "world": "Burglar alarms, smart doorbells and the tracking tags people put on bikes and luggage all work like this.", "v2": "The beep needs a V2 micro:bit.", "progs": [["both", "Same program on both micro:bits"]], "steps": [{"title": "Join your channel and arm the alarm", "prog": "both", "task": "Make the micro:bit join your radio group when it starts, then show a happy face so you know it is armed.", "think": ["Think back to the radio warm-up we did together. What did you put in 'on start'?"], "blocks": ["basic: on start", "radio: radio set group", "basic: show icon"], "pseudo": "basic: on start\n  radio: radio set group [{G}]\n  basic: show icon [happy face]", "check": "Both micro:bits show a happy face."}, {"title": "Send an alert when shaken", "prog": "both", "task": "When the micro:bit is shaken, send the number 1 to your partner.", "think": ["The micro:bit has sensors built in. Which Input block waits for a shake?"], "blocks": ["input: on shake", "radio: radio send number"], "pseudo": "input: on [shake]\n  radio: radio send number [1]", "check": "Shake it. Nothing happens on this micro:bit, but the other one will react once you finish the next step."}, {"title": "Sound the alarm", "prog": "both", "task": "When a message arrives, show an angry face and play a tone. Afterwards, go back to the happy face.", "think": ["Messages arriving is an event. Which blocks show faces and play sounds?", "A tone block takes time to play. What should come after it?"], "blocks": ["radio: on radio received receivedNumber", "basic: show icon", "music: play tone … for … beat"], "pseudo": "radio: on radio received [receivedNumber]\n  basic: show icon [angry face]\n  music: play tone [Middle C] for [1 beat]\n  basic: show icon [happy face]", "check": "Shake one micro:bit. The other shows an angry face and beeps."}], "test": ["Shaking micro:bit 1 sets off micro:bit 2.", "Shaking micro:bit 2 sets off micro:bit 1.", "Hide one micro:bit in a bag across the room. The alarm still works.", "A pair on a different radio group is not set off by your shaking."], "extend": [{"title": "Disarm switch", "text": "Make button A switch the alarm on and off, and show a sleeping face while it is off.", "hint": "You need a variable called armed that is true or false. Check it before you send. In blocks, use 'set armed to not armed'."}, {"title": "Flashing alarm", "text": "Make the alarm flash five times instead of showing once.", "hint": "Look in the Loops toolbox for 'repeat'. Put the show icon, tone and clear screen inside it."}, {"title": "Loudest alarm in the room", "text": "Design the most annoying alarm you can using different notes and icons. Does your partner agree it is annoying?"}]}, "remote-thermometer": {"id": "remote-thermometer", "level": 1, "emoji": "🌡️", "title": "Remote Thermometer", "tagline": "Read the temperature from across the room.", "make": "Each micro:bit measures its own temperature and sends it to its partner, which shows the number. Warm one micro:bit in your hands and watch the number change on the other one.", "learn": "Sensors can send their readings over a network, so you can read them from somewhere else.", "world": "Farms, greenhouses and smart homes use networks of tiny temperature sensors.", "v2": null, "progs": [["both", "Same program on both micro:bits"]], "steps": [{"title": "Join your channel", "prog": "both", "task": "Make the micro:bit join your pair's radio group when it switches on.", "think": ["Which block in the Radio toolbox picks a group? Where would you put it so it runs as soon as the micro:bit starts?"], "blocks": ["basic: on start", "radio: radio set group"], "pseudo": "basic: on start\n  radio: radio set group [{G}]", "check": "Nothing visible happens yet. That's fine, you will see it working in a later step."}, {"title": "Send the temperature", "prog": "both", "task": "Make the micro:bit send its temperature to your partner once every second, forever.", "think": ["Which Basic block repeats for ever?", "Which Input block gives you the temperature?", "Why add a pause? Think about what would happen if it sent as fast as it possibly could."], "blocks": ["basic: forever", "radio: radio send number", "input: temperature (°C)", "basic: pause (ms)"], "pseudo": "basic: forever\n  radio: radio send number [temperature (°C)]\n  basic: pause (ms) [1000]", "check": "Nothing visible yet. Your micro:bit is quietly sending."}, {"title": "Show your partner's temperature", "prog": "both", "task": "When a number arrives, show it on the screen.", "think": ["Which block runs when a radio message arrives?", "How do you show a number on the LEDs?"], "blocks": ["radio: on radio received receivedNumber", "basic: show number"], "pseudo": "radio: on radio received [receivedNumber]\n  basic: show number [receivedNumber]", "check": "Warm one micro:bit in your hands. The number on the other one goes up."}], "test": ["Each micro:bit shows a sensible room temperature, around 18 to 25.", "Holding one micro:bit in your hands makes the number on the other one rise.", "Remember the reading comes from the chip itself, so it is only approximate."], "extend": [{"title": "Too hot alarm", "text": "Show an alarm face and a tone if the temperature goes above a number you choose.", "hint": "First find out what your room normally reads. Then pick a number a few degrees higher and use an 'if' to compare."}, {"title": "Thermometer bar", "text": "Show the temperature as a bar of LEDs instead of a number.", "hint": "The bar graph block needs a highest value. Pick one that is a bit above room temperature, like 40."}, {"title": "Send it faster or slower", "text": "How often does a thermometer really need to send? Try a pause of 100 and a pause of 10000. What changes?"}]}, "emergency-beacon": {"id": "emergency-beacon", "level": 2, "emoji": "🆘", "title": "Emergency Beacon", "tagline": "Send an SOS and count how many calls were heard.", "make": "Press A to send an SOS. The other micro:bit flashes an alert three times and adds one to its count of how many SOS calls it has heard. Press B to see the count.", "learn": "Messages need codes so the receiver knows what they mean. A variable lets a micro:bit remember things.", "world": "Emergency beacons on boats and planes, and the SOS feature on a phone, send a code that means 'help'.", "v2": "The beep needs a V2 micro:bit.", "progs": [["both", "Same program on both micro:bits"]], "steps": [{"title": "Join your channel", "prog": "both", "task": "Make the micro:bit join your pair's radio group when it switches on.", "think": ["Which block in the Radio toolbox picks a group? Where would you put it so it runs as soon as the micro:bit starts?"], "blocks": ["basic: on start", "radio: radio set group"], "pseudo": "basic: on start\n  radio: radio set group [{G}]", "check": "Nothing visible happens yet. That's fine, you will see it working in a later step."}, {"title": "Send an SOS", "prog": "both", "task": "When button A is pressed, send the SOS code 999. Show a tick for half a second so the sender knows it went.", "think": ["Why 999? The receiver will check for this exact number so it knows it is an SOS, not something else.", "How do you make something appear and then disappear again?"], "blocks": ["input: on button A pressed", "radio: radio send number", "basic: show icon", "basic: pause (ms)", "basic: clear screen"], "pseudo": "input: on button [A] pressed\n  radio: radio send number [999]\n  basic: show icon [tick]\n  basic: pause (ms) [500]\n  basic: clear screen", "check": "Press A and a tick flashes. Nothing happens on the other micro:bit yet."}, {"title": "Flash an alert", "prog": "both", "task": "When a number arrives and it is 999, flash an alert three times with a tone each time.", "think": ["You need to check the number first. Which block lets you check?", "Repeating something three times is a job for a loop."], "blocks": ["radio: on radio received receivedNumber", "logic: if … then", "loops: repeat … times", "basic: show icon", "music: play tone … for … beat", "basic: clear screen", "basic: pause (ms)"], "pseudo": "radio: on radio received [receivedNumber]\n  logic: if [receivedNumber = 999] then\n    loops: repeat [3] times\n      basic: show icon [angry face]\n      music: play tone [Middle C] for [1/4 beat]\n      basic: clear screen\n      basic: pause (ms) [150]", "check": "Press A on one micro:bit. The other flashes three times."}, {"title": "Count the calls", "prog": "both", "task": "Make a variable called heard that starts at 0. Add 1 to it every time an SOS arrives.", "think": ["Look in the Variables toolbox for 'Make a Variable'.", "Which block adds 1 to a variable? Where should it go: before or after the loop?"], "blocks": ["vars: make a Variable", "vars: change … by …", "radio: on radio received receivedNumber"], "pseudo": "radio: on radio received [receivedNumber]\n  logic: if [receivedNumber = 999] then\n    vars: change [heard] by [1]\n    (the flashing loop goes after this)", "check": "Nothing changes on screen yet. The count is hidden inside the micro:bit."}, {"title": "Show the count", "prog": "both", "task": "When button B is pressed, show the value of heard.", "think": ["Which block shows a number? What goes inside it?"], "blocks": ["input: on button B pressed", "basic: show number", "vars: heard"], "pseudo": "input: on button [B] pressed\n  basic: show number [heard]", "check": "Press A on one micro:bit three times, then B on the other. It shows 3."}], "test": ["Pressing A shows a tick on the sender and a flashing alert on the receiver.", "Pressing B shows how many SOS calls that micro:bit has heard.", "The count goes up by one for each SOS, not more.", "Sending a different number, like 5, does not trigger the alert."], "extend": [{"title": "Send it three times", "text": "Real beacons repeat the message in case one gets lost. Make A send the SOS three times with a short pause between.", "hint": "Use a 'repeat 3 times' loop around the send block, with a pause of 100 inside. Now what happens to the count?"}, {"title": "All clear", "text": "Add a second code, 111, that means 'all clear' and shows a happy face. On a V2 micro:bit use 'on logo pressed' to send it.", "hint": "You need an 'else if' on the receiving side to check for 111."}, {"title": "Reset the count", "text": "Make pressing A and B together set the count back to zero.", "hint": "Look at the dropdown on the button block."}]}, "secret-code": {"id": "secret-code", "level": 2, "emoji": "🔐", "title": "Secret Code Messenger", "tagline": "Send numbers that only your partner can decode.", "make": "Pick a number from 0 to 9 with button A. Press B to send it. But the micro:bit scrambles the number first by adding a secret key. Your partner's micro:bit knows the key, so it can unscramble the number and show it.", "learn": "Encryption scrambles a message so only someone with the key can read it. Both sides must agree the key in advance.", "world": "Every time you send a message on WhatsApp or visit a website with a padlock, encryption like this protects you.", "v2": null, "progs": [["both", "Same program on both micro:bits"]], "steps": [{"title": "Channel, key and message", "prog": "both", "task": "Join your radio group. Make two variables: key, set to a secret number you and your partner agree (for example 7), and message, set to 0.", "think": ["Both micro:bits must use the same key or the message will not unscramble. Why?", "Look in the Variables toolbox. You can set variables inside 'on start'."], "blocks": ["basic: on start", "radio: radio set group", "vars: make a Variable", "vars: set … to …"], "pseudo": "basic: on start\n  radio: radio set group [{G}]\n  vars: set [key] to [7]\n  vars: set [message] to [0]", "check": "Nothing visible yet. Check with your partner that your keys match."}, {"title": "Choose a message", "prog": "both", "task": "Each press of A adds 1 to message and shows it. After 9, go back to 0.", "think": ["Which block adds 1 to a variable?", "How do you check if message has got too big? What do you do then?"], "blocks": ["input: on button A pressed", "vars: change … by …", "logic: if … then", "logic: > (comparison)", "vars: set … to …", "basic: show number"], "pseudo": "input: on button [A] pressed\n  vars: change [message] by [1]\n  logic: if [message > 9] then\n    vars: set [message] to [0]\n  basic: show number [message]", "check": "Press A repeatedly: the numbers count 1, 2, ... 9, 0, 1 ..."}, {"title": "Scramble and send", "prog": "both", "task": "When B is pressed, send message plus key (not just message). Show a tick.", "think": ["You need to do a sum inside the send block. Where is the + block?"], "blocks": ["input: on button B pressed", "radio: radio send number", "math: + (add)", "basic: show icon"], "pseudo": "input: on button [B] pressed\n  radio: radio send number [message + key]\n  basic: show icon [tick]", "check": "Press B and a tick appears. The number that left was scrambled."}, {"title": "Unscramble", "prog": "both", "task": "When a number arrives, take the key away and show the result.", "think": ["Scrambling added the key. What do you do to undo that?"], "blocks": ["radio: on radio received receivedNumber", "math: - (subtract)", "basic: show number"], "pseudo": "radio: on radio received [receivedNumber]\n  basic: show number [receivedNumber - key]", "check": "Pick 4 with A and press B. Your partner's micro:bit shows 4."}], "test": ["Picking a number and pressing B shows the same number on your partner's micro:bit.", "Change the key on one micro:bit only. Now the number comes out wrong.", "Ask a pair next to you to join your radio group but use a different key. Can they read your messages?"], "extend": [{"title": "Spy view", "text": "Show the scrambled number for a second before showing the real one. That is what a spy would see.", "hint": "Show receivedNumber, pause, then show receivedNumber minus key."}, {"title": "Longer messages", "text": "Send two or three numbers in a row to build a short code, like a PIN. Agree what each one means."}, {"title": "Harder scramble", "text": "Multiply by the key instead of adding. How do you unscramble it? Is it harder to crack?", "hint": "The opposite of multiplying is dividing."}]}, "interactive-art": {"id": "interactive-art", "level": 2, "emoji": "🎨", "title": "Interactive Art", "tagline": "Shake one micro:bit to paint on the other.", "make": "Every time you shake your micro:bit, a new dot appears at a random place on your partner's screen. Keep shaking and the dots build up into a picture. Press A to wipe the canvas clean.", "learn": "The data you send does not have to be a message. It can drive what a screen shows.", "world": "Remote controls, game controllers and drone controllers all send simple data that the other end turns into action.", "v2": null, "progs": [["both", "Same program on both micro:bits"]], "steps": [{"title": "Join your channel", "prog": "both", "task": "Make the micro:bit join your pair's radio group when it switches on.", "think": ["Which block in the Radio toolbox picks a group? Where would you put it so it runs as soon as the micro:bit starts?"], "blocks": ["basic: on start", "radio: radio set group"], "pseudo": "basic: on start\n  radio: radio set group [{G}]", "check": "Nothing visible happens yet. That's fine, you will see it working in a later step."}, {"title": "Shake to send a number", "prog": "both", "task": "When the micro:bit is shaken, send a random number from 0 to 4.", "think": ["The screen has 5 columns, counted 0 to 4. Why does that matter for the numbers you send?", "Look in the Math toolbox for something that picks a random number."], "blocks": ["input: on shake", "radio: radio send number", "math: pick random … to …"], "pseudo": "input: on [shake]\n  radio: radio send number [pick random 0 to 4]", "check": "Nothing happens on this micro:bit yet."}, {"title": "Plot a dot", "prog": "both", "task": "When a number arrives, plot a dot. The number decides the column (x) and a random number decides the row (y).", "think": ["The LED plot block needs an x and a y. Which one does the received number go in?"], "blocks": ["radio: on radio received receivedNumber", "led: plot x y", "math: pick random … to …"], "pseudo": "radio: on radio received [receivedNumber]\n  led: plot x [receivedNumber] y [pick random 0 to 4]", "check": "Shake one micro:bit. A dot appears on the other."}, {"title": "Wipe the canvas", "prog": "both", "task": "When button A is pressed, clear the screen.", "think": ["Which Basic block empties the screen?"], "blocks": ["input: on button A pressed", "basic: clear screen"], "pseudo": "input: on button [A] pressed\n  basic: clear screen", "check": "Shake a few times to build a picture, then press A to wipe it."}], "test": ["One shake adds one dot on your partner's micro:bit.", "Lots of shakes build up a picture.", "A clears the screen.", "Dots always stay on the screen. If one is missing, check your random numbers are 0 to 4."], "extend": [{"title": "Light-controlled brightness", "text": "Send the light level instead of a random number, and make each dot's brightness match.", "hint": "Use 'light level' from Input, and 'plot x y brightness' from LED. Light level goes from 0 to 255."}, {"title": "Tilt painter", "text": "Make the dot's column depend on how you tilt the sending micro:bit instead of a random number.", "hint": "Use 'acceleration x', then 'map' to squash -1023 to 1023 into 0 to 4."}, {"title": "Remote wipe", "text": "Let the sender clear the other screen. Pick one special number that means 'clear'.", "hint": "You need an if on the receiving side to check for your special number first."}]}, "proximity-alert": {"id": "proximity-alert", "level": 2, "emoji": "📍", "title": "Proximity Alert", "tagline": "An alarm that goes off when the beacon gets too close.", "make": "Each micro:bit sends a message all the time. When it hears its partner and the signal is strong (so they are close), it sounds an alarm. When they are far apart, it shows a calm face.", "learn": "Signal strength tells you roughly how far away something is. A program can make a decision based on it.", "world": "Social distancing apps, car keys that unlock when you walk up, and tracking tags all use signal strength.", "v2": "The beep needs a V2 micro:bit.", "progs": [["both", "Same program on both micro:bits"]], "steps": [{"title": "Join your channel", "prog": "both", "task": "Make the micro:bit join your pair's radio group when it switches on.", "think": ["Which block in the Radio toolbox picks a group? Where would you put it so it runs as soon as the micro:bit starts?"], "blocks": ["basic: on start", "radio: radio set group"], "pseudo": "basic: on start\n  radio: radio set group [{G}]", "check": "Nothing visible happens yet. That's fine, you will see it working in a later step."}, {"title": "Keep sending", "prog": "both", "task": "Make the micro:bit send a number again and again, with a short random pause.", "think": ["You did exactly this in Signal Meter. Remember the random pause?"], "blocks": ["basic: forever", "radio: radio send number", "basic: pause (ms)", "math: pick random … to …"], "pseudo": "basic: forever\n  radio: radio send number [0]\n  basic: pause (ms) [pick random 300 to 500]", "check": "Nothing visible yet."}, {"title": "Close or far?", "prog": "both", "task": "When a message arrives, check the signal strength. If it is stronger than -70, show an angry face and play a short tone. Otherwise show a happy face.", "think": ["Signal strength is negative. Is -50 stronger or weaker than -70? Which way should the comparison go?", "You need an if with an else."], "blocks": ["radio: on radio received receivedNumber", "logic: if … then … else", "logic: > (comparison)", "radio: radio received packet signal strength", "basic: show icon", "music: play tone … for … beat"], "pseudo": "radio: on radio received [receivedNumber]\n  logic: if [radio received packet (signal strength) > -70] then\n    basic: show icon [angry face]\n    music: play tone [Middle C] for [1/8 beat]\n  logic: else\n    basic: show icon [happy face]", "check": "Stand close: alarm. Walk apart: happy face."}, {"title": "Tune it for your room", "prog": "both", "task": "Is -70 the right distance? Walk to the distance you want the alarm to start, and use a number block to find the signal strength there. Change -70 to match.", "think": ["Think back to Signal Meter, where you showed the signal as a number."], "blocks": ["basic: show number", "radio: radio received packet signal strength"], "pseudo": "(temporary test program)\nradio: on radio received [receivedNumber]\n  basic: show number [radio received packet (signal strength)]", "check": "The alarm starts at the distance you chose."}], "test": ["Standing close together triggers the alarm on both micro:bits.", "Walking about three big steps apart switches to the calm face.", "Change the number from -70 to -50. The alarm now needs you to be closer.", "Walk right out of range. What does the screen show? (See the extension!)"], "extend": [{"title": "Out-of-range fix", "text": "When you walk out of range the micro:bit stays stuck on its last face. Fix it so a cross appears if nothing has been heard for a second and a half.", "hint": "Keep a variable called lastHeard. Set it with 'running time' every time a message arrives. In a second 'forever', check how long ago that was."}, {"title": "Three danger levels", "text": "Add a warning face for medium distance as well, so you have safe, warning and danger."}, {"title": "Quieter alarm", "text": "Make the alarm beep more slowly the further away you are.", "hint": "Use the pause block with a number that depends on the signal strength."}]}, "treasure-hunt": {"id": "treasure-hunt", "level": 2, "emoji": "💎", "title": "Treasure Hunt", "tagline": "Hide a beacon and hunt it down with a signal meter.", "make": "One micro:bit is the hidden treasure and sends a signal. Your partner hides it somewhere in the room. The other micro:bit is the hunter: it shows a signal meter, and when you get really close it shows a happy face and plays a tune.", "learn": "Hunting with signal strength works by moving, watching the signal rise or fall, and homing in.", "world": "Search-and-rescue teams find avalanche victims with beacons that work exactly like this.", "v2": "The tune needs a V2 micro:bit.", "progs": [["beacon", "Micro:bit 1 · The treasure (beacon)"], ["hunter", "Micro:bit 2 · The hunter"]], "steps": [{"title": "The treasure: join and send", "prog": "beacon", "task": "Program the treasure micro:bit. Join your radio group, show a diamond so you know which is which, then send a number again and again with a short random pause.", "think": ["It is the same sending code you used in Signal Meter. Add a show icon block to 'on start'."], "blocks": ["basic: on start", "radio: radio set group", "basic: show icon", "basic: forever", "radio: radio send number", "basic: pause (ms)", "math: pick random … to …"], "pseudo": "basic: on start\n  radio: radio set group [{G}]\n  basic: show icon [diamond]\nbasic: forever\n  radio: radio send number [0]\n  basic: pause (ms) [pick random 300 to 500]", "check": "The treasure micro:bit shows a diamond."}, {"title": "The hunter: show the meter", "prog": "hunter", "task": "Program the hunter micro:bit. Join the same radio group. When a message arrives, show the signal strength as a bar graph.", "think": ["Remember Signal Meter? The signal is negative, so add 128 before you plot it."], "blocks": ["basic: on start", "radio: radio set group", "radio: on radio received receivedNumber", "led: plot bar graph of … up to …", "radio: radio received packet signal strength"], "pseudo": "basic: on start\n  radio: radio set group [{G}]\nradio: on radio received [receivedNumber]\n  led: plot bar graph of [radio received packet (signal strength) + 128] up to [100]", "check": "Walk the hunter towards the treasure. The bar grows."}, {"title": "The hunter: found it!", "prog": "hunter", "task": "Make a variable called signal. When a message arrives, save the signal strength in it. If it is stronger than -50, show a happy face and play a tune. Otherwise show the bar graph.", "think": ["You need to look at the signal twice, once to decide and once to draw. A variable saves doing the sum twice.", "An if with an else. The bar graph goes in the else."], "blocks": ["vars: make a Variable", "vars: set … to …", "logic: if … then … else", "logic: > (comparison)", "basic: show icon", "music: play tone … for … beat"], "pseudo": "radio: on radio received [receivedNumber]\n  vars: set [signal] to [radio received packet (signal strength)]\n  logic: if [signal > -50] then\n    basic: show icon [happy face]\n    music: play tone [High C] for [1/2 beat]\n  logic: else\n    led: plot bar graph of [signal + 128] up to [100]", "check": "Touch the hunter to the treasure and the happy face appears."}], "test": ["The hunter's bar grows as you walk towards the treasure.", "The happy face and tune appear only when you are very close.", "Hide the treasure behind a cupboard or a door. Can the hunter still find it?", "Swap roles. Can you find your partner's hiding place?"], "extend": [{"title": "Harder to find", "text": "Make the treasure's signal weaker so the hunter has to get much closer.", "hint": "Look in the Radio toolbox for 'set transmit power'. It goes from 0 (weakest) to 7. Try 1, 2 or 3 on the treasure micro:bit."}, {"title": "Hot and cold", "text": "Show a cold, warm or hot icon instead of the bar graph.", "hint": "You need an if with 'else if' and two different numbers to compare the signal against."}, {"title": "Tune the 'found it' distance", "text": "Is -50 right for your room? Walk to where you want 'found it' to start and check the number."}]}, "connected-cars": {"id": "connected-cars", "level": 2, "emoji": "🚗", "title": "Connected Cars", "tagline": "Brake in one car and warn the car behind.", "make": "Each micro:bit is a car driving along (an arrow on screen). Press A to brake. The braking car shows a stop square, and the car behind gets a flashing warning with a beep so it can slow down too.", "learn": "Devices can warn each other about events before a person could possibly notice.", "world": "Connected cars, emergency vehicles and traffic lights can warn each other about braking, crashes and ambulances.", "v2": "The beep needs a V2 micro:bit.", "progs": [["both", "Same program on both micro:bits"]], "steps": [{"title": "Start driving", "prog": "both", "task": "Join your radio group, then show an arrow pointing up to show the car is driving.", "think": ["Look for the 'show arrow' block in Basic."], "blocks": ["basic: on start", "radio: radio set group", "basic: show arrow"], "pseudo": "basic: on start\n  radio: radio set group [{G}]\n  basic: show arrow [North]", "check": "Both micro:bits show an arrow."}, {"title": "Brake!", "prog": "both", "task": "When A is pressed, send the number 1, show a small square for one and a half seconds, then go back to the arrow.", "think": ["Pressing A is the event. What two things happen: sending and showing?"], "blocks": ["input: on button A pressed", "radio: radio send number", "basic: show icon", "basic: pause (ms)", "basic: show arrow"], "pseudo": "input: on button [A] pressed\n  radio: radio send number [1]\n  basic: show icon [small square]\n  basic: pause (ms) [1500]\n  basic: show arrow [North]", "check": "Press A: your micro:bit shows a square and returns to the arrow."}, {"title": "Collision warning", "prog": "both", "task": "When a message arrives, flash a warning face three times with a tone each time, then go back to the arrow.", "think": ["Doing something three times is a job for a loop.", "Inside the loop: show, tone, clear, pause."], "blocks": ["radio: on radio received receivedNumber", "loops: repeat … times", "basic: show icon", "music: play tone … for … beat", "basic: clear screen", "basic: pause (ms)", "basic: show arrow"], "pseudo": "radio: on radio received [receivedNumber]\n  loops: repeat [3] times\n    basic: show icon [surprised face]\n    music: play tone [Middle C] for [1/4 beat]\n    basic: clear screen\n    basic: pause (ms) [150]\n  basic: show arrow [North]", "check": "Press A on one car. The other flashes a warning and goes back to driving."}], "test": ["Braking in car 1 warns car 2, and braking in car 2 warns car 1.", "Both cars go back to the arrow afterwards.", "Press A twice quickly. What happens? Is that a problem for a real car?"], "extend": [{"title": "Only warn cars nearby", "text": "Make the warning only appear if the other car is close, using signal strength.", "hint": "Put your warning loop inside an 'if' that checks the signal strength, like in Proximity Alert."}, {"title": "Emergency brake", "text": "Let a shake of the micro:bit trigger an emergency brake with a different, more urgent warning.", "hint": "Send a different number, like 2, and check for it on the receiving side."}, {"title": "Road convoy", "text": "Join with another pair on the same radio group so three or four cars are in a convoy. What happens when the lead car brakes?"}]}, "tilt-theremin": {"id": "tilt-theremin", "level": 2, "emoji": "🎵", "title": "Tilt Theremin", "tagline": "Play an instrument by tilting a micro:bit.", "make": "One micro:bit is the instrument and the other is the speaker. Hold A on the instrument and tilt it left and right. The speaker micro:bit plays a note, and the pitch goes up and down as you tilt. Keep the volume low!", "learn": "A network can carry a live stream of sensor readings, like a constant flow of numbers.", "world": "Wireless game controllers, VR headsets and remote-control cars send live sensor readings like this many times a second.", "v2": "Sound only works on a V2 micro:bit (the speaker one).", "progs": [["sender", "Micro:bit 1 · The instrument (sender)"], ["player", "Micro:bit 2 · The speaker (receiver)"]], "steps": [{"title": "The instrument: join the channel", "prog": "sender", "task": "Program micro:bit 1. Join your radio group when it starts.", "think": ["The same first step as every other project."], "blocks": ["basic: on start", "radio: radio set group"], "pseudo": "basic: on start\n  radio: radio set group [{G}]", "check": "Nothing visible yet."}, {"title": "The instrument: send the tilt", "prog": "sender", "task": "Keep checking if button A is held down. If it is, send the left-right tilt (acceleration x) and pause for 100 milliseconds.", "think": ["Which Input block tells you if a button is being held? It is different from 'on button pressed'.", "Which Input block measures tilt? It has three directions: pick the left-right one."], "blocks": ["basic: forever", "logic: if … then", "input: button A is pressed", "radio: radio send number", "input: acceleration (mg) x", "basic: pause (ms)"], "pseudo": "basic: forever\n  logic: if [button A is pressed] then\n    radio: radio send number [acceleration (mg) x]\n  basic: pause (ms) [100]", "check": "Nothing visible on this micro:bit. Move on to the speaker."}, {"title": "The speaker: get ready", "prog": "player", "task": "Program micro:bit 2. Join the same radio group, and set the volume low so the room stays calm.", "think": ["Look in the Music toolbox for a volume block. Lower numbers are quieter."], "blocks": ["basic: on start", "radio: radio set group", "music: set volume"], "pseudo": "basic: on start\n  radio: radio set group [{G}]\n  music: set volume [80]", "check": "Nothing visible yet."}, {"title": "The speaker: play the note", "prog": "player", "task": "When a number arrives, play a short note. The tilt is from -1023 to 1023 but a useful pitch is about 200 to 1000, so use 'map' to convert it.", "think": ["Look in the Math toolbox for 'map'. What are the 'from' range and the 'to' range?", "A short tone, about 100 milliseconds, will sound like a continuous note when messages keep arriving."], "blocks": ["radio: on radio received receivedNumber", "music: play tone … for … ms", "math: map … from … to …"], "pseudo": "radio: on radio received [receivedNumber]\n  music: play tone [map receivedNumber from low -1023 high 1023 to low 200 high 1000] for [100] ms", "check": "Hold A on micro:bit 1 and tilt it. Micro:bit 2 plays a note that changes pitch."}], "test": ["Nothing plays when A is not held.", "Tilting to the left gives a low note and tilting to the right gives a high note (or the other way round).", "If the pitch goes the wrong way for you, swap the 200 and 1000 in the map block.", "Keep the volume low enough that other pairs can still talk."], "extend": [{"title": "Add volume control", "text": "Use the up-down tilt to control the volume at the same time as the left-right tilt controls pitch.", "hint": "Send a second number with 'send value' (give it a name like 'vol'), and catch both with 'on radio received name value'."}, {"title": "A scale of notes", "text": "Play just 8 fixed notes instead of a smooth slide, so it sounds like a proper scale.", "hint": "Use 'map' to squash the tilt into 0 to 7, then check which number it is and play a different note for each."}, {"title": "Two instruments", "text": "Make a duet with another pair using different radio groups and different speakers."}]}, "gesture-chat": {"id": "gesture-chat", "level": 3, "emoji": "💬", "title": "Gesture Chat", "tagline": "Chat in emoji using buttons, shakes and taps.", "make": "Four different actions each send a different message: button A, button B, a shake and a tap on the logo. When the other micro:bit receives a message it shows a different emoji for each. You design what each one says!", "learn": "A number can stand for a meaning. Sender and receiver must agree what each number means, like a shared dictionary.", "world": "Messaging apps send emoji as codes. Both phones use the same table, so a heart on yours is a heart on theirs.", "v2": "Tapping the logo needs a V2 micro:bit.", "progs": [["both", "Same program on both micro:bits"]], "steps": [{"title": "Join your channel", "prog": "both", "task": "Make the micro:bit join your pair's radio group when it switches on.", "think": ["Which block in the Radio toolbox picks a group? Where would you put it so it runs as soon as the micro:bit starts?"], "blocks": ["basic: on start", "radio: radio set group"], "pseudo": "basic: on start\n  radio: radio set group [{G}]", "check": "Nothing visible happens yet. That's fine, you will see it working in a later step."}, {"title": "Pick your four messages", "prog": "both", "task": "Before you code, agree with your partner: which action sends which number, and which emoji each number shows. Write it down as a mini table.", "think": ["You have four inputs: button A, button B, shake and logo tap. What emotions or messages will they send?", "Both micro:bits must follow the same table or the emoji will be wrong."], "blocks": ["(no blocks yet, this is planning!)"], "pseudo": "(planning step)\n1 = button A  → happy face\n2 = button B  → sad face\n3 = shake     → surprised face\n4 = logo tap  → heart", "check": "You and your partner have the same table written down."}, {"title": "Send the four numbers", "prog": "both", "task": "Make each of the four inputs send its own number.", "think": ["Which Input blocks wait for A, B, a shake and a logo tap?", "The logo block is called 'on logo pressed'."], "blocks": ["input: on button A pressed", "input: on button B pressed", "input: on shake", "input: on logo pressed", "radio: radio send number"], "pseudo": "input: on button [A] pressed\n  radio: radio send number [1]\ninput: on button [B] pressed\n  radio: radio send number [2]\ninput: on [shake]\n  radio: radio send number [3]\ninput: on logo [pressed]\n  radio: radio send number [4]", "check": "Nothing visible yet, until you build the receiving side."}, {"title": "Choose the emoji", "prog": "both", "task": "When a number arrives, show the right icon. You need to check for each number in turn.", "think": ["One if is not enough. Click the + on the if block to add more 'else if' parts.", "Each 'else if' checks for a different number."], "blocks": ["radio: on radio received receivedNumber", "logic: if … then … else if", "logic: = (comparison)", "basic: show icon"], "pseudo": "radio: on radio received [receivedNumber]\n  logic: if [receivedNumber = 1] then\n    basic: show icon [happy face]\n  logic: else if [receivedNumber = 2] then\n    basic: show icon [sad face]\n  logic: else if [receivedNumber = 3] then\n    basic: show icon [surprised face]\n  logic: else if [receivedNumber = 4] then\n    basic: show icon [heart]", "check": "Every action on one micro:bit shows the right emoji on the other."}], "test": ["All four actions work, in both directions.", "Each action shows a different emoji.", "Try a conversation using only your four emoji. Can your partner understand what you mean?"], "extend": [{"title": "Reply button", "text": "Make the micro:bit automatically reply with a thumbs up when it gets a heart.", "hint": "Inside the 'heart' branch, add a 'radio send number'. Choose a new number and add a new branch for it."}, {"title": "Send words", "text": "Add a way to send short words as well as emoji.", "hint": "Look for 'radio send string' and 'on radio received string'. Strings are words, numbers are numbers."}, {"title": "Design your own emoji", "text": "Draw your own pictures using 'show leds' and make your own set of emoji."}]}, "remote-pixel": {"id": "remote-pixel", "level": 3, "emoji": "🎮", "title": "Remote Pixel", "tagline": "Tilt one micro:bit to steer a dot on the other.", "make": "One micro:bit is the controller and the other is the screen. Tilt the controller left, right, forward and back, and a single dot moves around the other micro:bit's screen to match.", "learn": "Radio messages can carry names as well as numbers, so you can send two things at once, like an x and a y.", "world": "Drone controllers and radio-controlled cars send joystick positions as numbers many times a second.", "v2": null, "progs": [["sender", "Micro:bit 1 · The controller"], ["screen", "Micro:bit 2 · The screen"]], "steps": [{"title": "The controller: send x and y", "prog": "sender", "task": "Program micro:bit 1. Join your radio group. Then, forever, send the left-right tilt with the name \"x\" and the forward-back tilt with the name \"y\", pausing 100 milliseconds.", "think": ["Look in the Radio toolbox for a block that sends a value with a name.", "Which Input block measures tilt? It has three directions: x, y and z."], "blocks": ["basic: on start", "radio: radio set group", "basic: forever", "radio: radio send value … = …", "input: acceleration (mg) x", "input: acceleration (mg) y", "basic: pause (ms)"], "pseudo": "basic: on start\n  radio: radio set group [{G}]\nbasic: forever\n  radio: radio send value name [\"x\"] value [acceleration (mg) x]\n  radio: radio send value name [\"y\"] value [acceleration (mg) y]\n  basic: pause (ms) [100]", "check": "Nothing visible on this micro:bit. Move on to the screen."}, {"title": "The screen: make x and y", "prog": "screen", "task": "Program micro:bit 2. Join the same radio group, then make two variables called x and y, both set to 2 (the middle of the screen).", "think": ["The screen is 5 by 5, counted from 0 to 4. What number is in the middle?"], "blocks": ["basic: on start", "radio: radio set group", "vars: make a Variable", "vars: set … to …"], "pseudo": "basic: on start\n  radio: radio set group [{G}]\n  vars: set [x] to [2]\n  vars: set [y] to [2]", "check": "Nothing visible yet."}, {"title": "The screen: catch the values", "prog": "screen", "task": "When a named value arrives, check its name. If it is \"x\", store it in x. Otherwise, if it is \"y\", store it in y. The tilt is from -1023 to 1023, but the screen only goes from 0 to 4, so use 'map' to squash it.", "think": ["Look for 'on radio received name value'. It gives you two boxes: name and value.", "Look in the Math toolbox for 'map'. What are the 'from' range and the 'to' range?"], "blocks": ["radio: on radio received name value", "logic: if … then … else if", "logic: = (comparison)", "vars: set … to …", "math: map … from … to …"], "pseudo": "radio: on radio received [name] [value]\n  logic: if [name = \"x\"] then\n    vars: set [x] to [map value from low -1023 high 1023 to low 0 high 4]\n  logic: else if [name = \"y\"] then\n    vars: set [y] to [map value from low -1023 high 1023 to low 0 high 4]", "check": "Nothing visible yet. The numbers are stored but not drawn."}, {"title": "The screen: draw the dot", "prog": "screen", "task": "After the checks, clear the screen and plot a dot at x and y. Do this inside the same 'on radio received' block, after the if.", "think": ["Which Basic block empties the screen? Which LED block lights one pixel?"], "blocks": ["basic: clear screen", "led: plot x y", "vars: x", "vars: y"], "pseudo": "radio: on radio received [name] [value]\n  (the if / else if from before)\n  basic: clear screen\n  led: plot x [x] y [y]", "check": "Tilt the controller. A dot moves on the other micro:bit."}], "test": ["Tilting right moves the dot right (or left, depending on how you hold it).", "Tilting forward and back moves the dot up and down.", "If a direction is backwards, swap the 'to' numbers in the map block (0 and 4 swap places).", "A very hard tilt does not crash the program, the dot just disappears."], "extend": [{"title": "Fix the corners", "text": "A very hard tilt makes the dot disappear because the number goes outside 0 to 4. Make the dot stick to the edge instead.", "hint": "Look for 'minimum' and 'maximum' in the Math toolbox. Check x is not below 0 and not above 4."}, {"title": "Draw with the dot", "text": "Don't clear the screen, so the dot leaves a trail. Press A to wipe the picture.", "hint": "Remove the clear screen block from the receiving code and put it in 'on button A pressed'."}, {"title": "Add a button", "text": "Press A on the controller to make the dot on the screen micro:bit blink.", "hint": "Send a different named value, such as \"blink\", and check for it on the receiving side."}]}, "signal-lamp": {"id": "signal-lamp", "level": 3, "emoji": "💡", "title": "Signal Lamp", "tagline": "Send secret flashes, short and long, like Morse code.", "make": "Press A to send a short flash and B to send a long flash. Your partner's micro:bit lights up its whole screen for a short or long time. Agree a code, like short-short-long means 'help', and talk using only flashes.", "learn": "A protocol is an agreed set of rules for communicating. A code only works if everyone uses the same rules.", "world": "Morse code, lighthouse signals and the way two computers agree on a 1 and a 0 are all protocols.", "v2": null, "progs": [["both", "Same program on both micro:bits"]], "steps": [{"title": "Join your channel", "prog": "both", "task": "Make the micro:bit join your pair's radio group when it switches on.", "think": ["Which block in the Radio toolbox picks a group? Where would you put it so it runs as soon as the micro:bit starts?"], "blocks": ["basic: on start", "radio: radio set group"], "pseudo": "basic: on start\n  radio: radio set group [{G}]", "check": "Nothing visible happens yet. That's fine, you will see it working in a later step."}, {"title": "Send short and long", "prog": "both", "task": "Make button A send the number 1 (a short flash) and button B send the number 2 (a long flash).", "think": ["You did this in the radio warm-up we did together."], "blocks": ["input: on button A pressed", "input: on button B pressed", "radio: radio send number"], "pseudo": "input: on button [A] pressed\n  radio: radio send number [1]\ninput: on button [B] pressed\n  radio: radio send number [2]", "check": "Nothing visible yet."}, {"title": "Make the lamp light up", "prog": "both", "task": "When a number arrives, light up all 25 LEDs.", "think": ["Look for 'show leds' in the Basic toolbox. You can click every square to switch it on."], "blocks": ["radio: on radio received receivedNumber", "basic: show leds"], "pseudo": "radio: on radio received [receivedNumber]\n  basic: show leds [all 25 LEDs on]", "check": "Press A on one micro:bit and the other's whole screen lights up (and stays on)."}, {"title": "Short or long?", "prog": "both", "task": "Keep the lamp on for a short time (200 milliseconds) if the number was 1, or a long time (800 milliseconds) otherwise. Then switch it off.", "think": ["You need an if with an else, and a pause block in each part.", "What do you do after the if to switch the lamp off?"], "blocks": ["logic: if … then … else", "logic: = (comparison)", "basic: pause (ms)", "basic: clear screen"], "pseudo": "radio: on radio received [receivedNumber]\n  basic: show leds [all 25 LEDs on]\n  logic: if [receivedNumber = 1] then\n    basic: pause (ms) [200]\n  logic: else\n    basic: pause (ms) [800]\n  basic: clear screen", "check": "A gives a quick blink and B gives a longer one."}], "test": ["Pressing A gives a short flash on your partner's micro:bit.", "Pressing B gives a long flash.", "Agree a code with your partner. Send a three-flash message. Can they decode it by watching?", "Try sending a message to your partner with your micro:bits turned away from each other. Does it still work?"], "extend": [{"title": "One button for both", "text": "Use just button A. A quick press sends short, and holding it down sends long.", "hint": "Inside 'on button A pressed', use 'running time' to remember the start, then a 'while' loop that waits while the button is still pressed. Compare the time afterwards."}, {"title": "Code book", "text": "Make a card listing five words and their flash patterns. Swap with another pair. Can they read your messages?"}, {"title": "Sound as well as light", "text": "Make the receiving micro:bit beep for the length of the flash, as in Morse code. Sound needs a V2 micro:bit.", "hint": "Use 'play tone' with a time in milliseconds, instead of a pause."}]}, "read-receipts": {"id": "read-receipts", "level": 3, "emoji": "✅", "title": "Read Receipts", "tagline": "Get a tick when your message has been delivered.", "make": "Press A to send a message. The other micro:bit shows a heart when it arrives and automatically sends back a reply that says 'got it'. When that reply arrives, your micro:bit shows a tick. Just like the ticks on a messaging app!", "learn": "Networks use acknowledgements: a reply that says the message was received, so the sender knows it was delivered.", "world": "WhatsApp ticks, tracked parcels and the way the internet resends lost data all depend on acknowledgements.", "v2": null, "progs": [["both", "Same program on both micro:bits"]], "steps": [{"title": "Join your channel", "prog": "both", "task": "Make the micro:bit join your pair's radio group when it switches on.", "think": ["Which block in the Radio toolbox picks a group? Where would you put it so it runs as soon as the micro:bit starts?"], "blocks": ["basic: on start", "radio: radio set group"], "pseudo": "basic: on start\n  radio: radio set group [{G}]", "check": "Nothing visible happens yet. That's fine, you will see it working in a later step."}, {"title": "Send a message", "prog": "both", "task": "When A is pressed, show a small diamond (meaning 'sending') and send the number 1.", "think": ["Think about what the sender sees while it waits."], "blocks": ["input: on button A pressed", "basic: show icon", "radio: radio send number"], "pseudo": "input: on button [A] pressed\n  basic: show icon [small diamond]\n  radio: radio send number [1]", "check": "Press A: a small diamond appears."}, {"title": "Receive and reply", "prog": "both", "task": "When a 1 arrives (a message), show a heart and send back the number 2 (the 'got it' reply).", "think": ["Why does the reply use a different number to the message? What would happen if both used 1?"], "blocks": ["radio: on radio received receivedNumber", "logic: if … then", "logic: = (comparison)", "basic: show icon", "radio: radio send number"], "pseudo": "radio: on radio received [receivedNumber]\n  logic: if [receivedNumber = 1] then\n    basic: show icon [heart]\n    radio: radio send number [2]", "check": "Press A on one micro:bit. The other shows a heart."}, {"title": "Show the tick", "prog": "both", "task": "When a 2 arrives (the reply), show a tick. Use an 'else if' on the same block.", "think": ["You already have an if for number 1. Click the + to add another part for number 2."], "blocks": ["logic: if … then … else if", "basic: show icon"], "pseudo": "radio: on radio received [receivedNumber]\n  logic: if [receivedNumber = 1] then\n    basic: show icon [heart]\n    radio: radio send number [2]\n  logic: else if [receivedNumber = 2] then\n    basic: show icon [tick]", "check": "Press A. Your partner shows a heart and you see a tick."}], "test": ["Press A on micro:bit 1: heart on micro:bit 2, then a tick on micro:bit 1.", "It works both ways round.", "Walk well out of range and press A. What happens? Is that what you want?"], "extend": [{"title": "Delivery failed", "text": "If no reply arrives within two seconds, show a cross to say the message was not delivered.", "hint": "Make a variable called delivered that is false. Set it to true when the reply arrives. After sending, pause two seconds, then check: if not delivered, show the cross."}, {"title": "Try again automatically", "text": "If the delivery fails, send the message again, up to three times.", "hint": "Wrap the sending in a loop and stop looping when delivered becomes true."}, {"title": "Message numbers", "text": "Send a different number each time, and have the reply say which message it is acknowledging, so you can tell which message got through."}]}, "digital-lock": {"id": "digital-lock", "level": 4, "emoji": "🔒", "title": "Digital Lock", "tagline": "Only the right secret code opens the lock.", "make": "Two micro:bits: a keypad and a lock. On the keypad you press A and B three times to enter a code. The keypad sends the code to the lock. If it is the right one, the lock opens with a tick and a happy tune. If it is wrong, the lock shows a cross and a low buzz.", "learn": "Authentication means proving who you are, here with a secret code. The lock must check the code before it lets anyone in.", "world": "Door entry systems, car key fobs and phone unlock codes all check a secret before they let you in.", "v2": "The sounds need a V2 micro:bit.", "progs": [["keypad", "Micro:bit 1 · The keypad"], ["lock", "Micro:bit 2 · The lock"]], "steps": [{"title": "The lock: show it is locked", "prog": "lock", "task": "Program micro:bit 2. Join your radio group, make a variable called secret and set it to 121 (that means press A, B, A), then draw a padlock on the screen.", "think": ["The 'show leds' block lets you draw a picture. Can you draw a padlock?", "You can choose a different secret using only 1s and 2s, like 112 or 222."], "blocks": ["basic: on start", "radio: radio set group", "vars: make a Variable", "vars: set … to …", "basic: show leds"], "pseudo": "basic: on start\n  radio: radio set group [{G}]\n  vars: set [secret] to [121]\n  basic: show leds [padlock picture]", "check": "The lock micro:bit shows a padlock."}, {"title": "The lock: check the code", "prog": "lock", "task": "When a number arrives, check if it matches secret. If it does, show a tick, play a high note and wait two seconds. If not, show a cross, play a low note and wait one second. Then draw the padlock again.", "think": ["You need an if with an else.", "What goes after the if/else so the lock always locks again?"], "blocks": ["radio: on radio received receivedNumber", "logic: if … then … else", "logic: = (comparison)", "basic: show icon", "music: play tone … for … beat", "basic: pause (ms)", "basic: show leds"], "pseudo": "radio: on radio received [receivedNumber]\n  logic: if [receivedNumber = secret] then\n    basic: show icon [tick]\n    music: play tone [High C] for [1 beat]\n    basic: pause (ms) [2000]\n  logic: else\n    basic: show icon [cross]\n    music: play tone [Low C] for [1 beat]\n    basic: pause (ms) [1000]\n  basic: show leds [padlock picture]", "check": "You can test the lock later when the keypad is ready."}, {"title": "The keypad: collect the presses", "prog": "keypad", "task": "Program micro:bit 1. Join your radio group and make two variables, code and presses, both starting at 0. When A is pressed, add the digit 1 to the end of code, and add 1 to presses.", "think": ["To add a digit to the end of a number, multiply the number by 10 first, then add the digit. For example 1 → 12 → 121.", "Look for 'change presses by 1'."], "blocks": ["basic: on start", "radio: radio set group", "vars: make a Variable", "vars: set … to …", "input: on button A pressed", "math: × (multiply)", "math: + (add)", "vars: change … by …"], "pseudo": "basic: on start\n  radio: radio set group [{G}]\n  vars: set [code] to [0]\n  vars: set [presses] to [0]\ninput: on button [A] pressed\n  vars: set [code] to [code × 10 + 1]\n  vars: change [presses] by [1]", "check": "Nothing visible yet. The keypad is counting in the background."}, {"title": "The keypad: show progress and send", "prog": "keypad", "task": "Light one LED per press along the middle row, so you can see how many digits you have entered. When presses reaches 3, send the code, reset both variables to 0, and flash a tick.", "think": ["LED plot takes an x and a y. If presses is 1, which column should light?", "After sending, what must you do so the next code starts fresh?"], "blocks": ["led: plot x y", "math: - (subtract)", "logic: if … then", "logic: = (comparison)", "radio: radio send number", "vars: set … to …", "basic: show icon", "basic: pause (ms)", "basic: clear screen"], "pseudo": "input: on button [A] pressed\n  vars: set [code] to [code × 10 + 1]\n  vars: change [presses] by [1]\n  led: plot x [presses - 1] y [2]\n  logic: if [presses = 3] then\n    radio: radio send number [code]\n    vars: set [code] to [0]\n    vars: set [presses] to [0]\n    basic: show icon [tick]\n    basic: pause (ms) [500]\n    basic: clear screen", "check": "Press A three times: three LEDs light, then a tick."}, {"title": "The keypad: add button B", "prog": "keypad", "task": "Copy everything you did for A into button B, but add the digit 2 instead of 1.", "think": ["Right-click the 'on button A pressed' block and choose Duplicate. Then change the A to B and the 1 to a 2.", "Both buttons share the same variables, so mixing A and B works."], "blocks": ["input: on button B pressed"], "pseudo": "input: on button [B] pressed\n  vars: set [code] to [code × 10 + 2]\n  vars: change [presses] by [1]\n  (the rest is the same as button A)", "check": "Press A, B, A on the keypad. The lock opens. Try another code and it stays locked."}], "test": ["The right code (A, B, A) opens the lock and shows a tick.", "A wrong code, like B, B, B, shows a cross.", "After a try, you can enter another code straight away.", "Change the secret on the lock to a code of your own. Does the lock still work?"], "extend": [{"title": "Three strikes", "text": "After three wrong codes in a row, lock for ten seconds and show a countdown.", "hint": "You need a variable called strikes. Add 1 for each wrong code, reset it for a right one, and add an if that checks for 3."}, {"title": "Change the secret", "text": "Let the lock owner change the secret code from the lock micro:bit without re-programming it.", "hint": "Use button A on the lock micro:bit to change a digit of secret. Think about how the keypad collects digits."}, {"title": "Tidy with a function", "text": "Your A and B code is almost identical. Make a function with a digit input, so it only appears once.", "hint": "Look in 'Advanced', then 'Functions'. Make a function called enterDigit with a number input."}, {"title": "Cyber challenge", "text": "A neighbouring pair joins your radio group and tries to guess your code by trying everything. How many tries do they need? What does this tell you about short codes?"}]}, "radio-duel": {"id": "radio-duel", "level": 4, "emoji": "⚔️", "title": "Radio Duel", "tagline": "A reaction race played entirely over radio.", "make": "A two-player reaction game. One player presses B to start a round. Both micro:bits show a sleepy face, then after a random wait a target appears. First to press A wins! Press too early and you are out of that round. The winner's micro:bit shows a tick and the loser's shows a sad face.", "learn": "A shared 'state' stops the two micro:bits getting out of step. Each message moves the game from one state to the next.", "world": "Online games must keep every player's screen in step, even though messages take a moment to travel.", "v2": null, "progs": [["both", "Same program on both micro:bits"]], "steps": [{"title": "Join your channel", "prog": "both", "task": "Make the micro:bit join your pair's radio group when it switches on.", "think": ["Which block in the Radio toolbox picks a group? Where would you put it so it runs as soon as the micro:bit starts?"], "blocks": ["basic: on start", "radio: radio set group"], "pseudo": "basic: on start\n  radio: radio set group [{G}]", "check": "Nothing visible happens yet. That's fine, you will see it working in a later step."}, {"title": "Plan the three messages", "prog": "both", "task": "The game uses three messages: 0 means 'get ready', 1 means 'GO!', and 2 means 'I won'. It also uses a variable called state: 0 is waiting, 1 is GO, and 2 is round over. Make the variable and set it to 2.", "think": ["A state variable remembers what stage of the game the micro:bit is in.", "Start with state 2, which means 'nothing is happening yet'."], "blocks": ["basic: on start", "vars: make a Variable", "vars: set … to …"], "pseudo": "basic: on start\n  radio: radio set group [{G}]\n  vars: set [state] to [2]\n  basic: show icon [happy face]", "check": "Both micro:bits show a happy face."}, {"title": "Start a round", "prog": "both", "task": "When B is pressed: send 0, set state to 0, show a sleepy face, pause a random 2 to 5 seconds, then send 1. If state is still 0, set state to 1 and show a target.", "think": ["Why check state is still 0 after the pause? What if the starter pressed A too early?", "Pick random takes two numbers in milliseconds. 2 seconds is 2000."], "blocks": ["input: on button B pressed", "radio: radio send number", "vars: set … to …", "basic: show icon", "basic: pause (ms)", "math: pick random … to …", "logic: if … then", "logic: = (comparison)"], "pseudo": "input: on button [B] pressed\n  radio: radio send number [0]\n  vars: set [state] to [0]\n  basic: show icon [sleeping face]\n  basic: pause (ms) [pick random 2000 to 5000]\n  radio: radio send number [1]\n  logic: if [state = 0] then\n    vars: set [state] to [1]\n    basic: show icon [target]", "check": "Press B: a sleepy face, then a target after a random wait."}, {"title": "React to the messages", "prog": "both", "task": "When a number arrives: if it is 0, set state to 0 and show the sleepy face. If it is 1 and state is 0, set state to 1 and show the target. If it is 2 and state is 1, set state to 2 and show a sad face (you lost).", "think": ["You need an if with two 'else if' parts.", "Use the 'and' block to check two things at once, like 'receivedNumber = 1 and state = 0'."], "blocks": ["radio: on radio received receivedNumber", "logic: if … then … else if", "logic: and", "logic: = (comparison)", "vars: set … to …", "basic: show icon"], "pseudo": "radio: on radio received [receivedNumber]\n  logic: if [receivedNumber = 0] then\n    vars: set [state] to [0]\n    basic: show icon [sleeping face]\n  logic: else if [receivedNumber = 1 and state = 0] then\n    vars: set [state] to [1]\n    basic: show icon [target]\n  logic: else if [receivedNumber = 2 and state = 1] then\n    vars: set [state] to [2]\n    basic: show icon [sad face]", "check": "Both micro:bits show the sleepy face and then the target."}, {"title": "Press to win", "prog": "both", "task": "When A is pressed: if state is 1, set state to 2, send 2 and show a tick. Otherwise, if state is 0, you pressed too early: set state to 2 and show a cross.", "think": ["State 1 means GO. What should happen if you press at the right time?", "State 0 means wait. What if you press then?"], "blocks": ["input: on button A pressed", "logic: if … then … else if", "logic: = (comparison)", "vars: set … to …", "radio: radio send number", "basic: show icon"], "pseudo": "input: on button [A] pressed\n  logic: if [state = 1] then\n    vars: set [state] to [2]\n    radio: radio send number [2]\n    basic: show icon [tick]\n  logic: else if [state = 0] then\n    vars: set [state] to [2]\n    basic: show icon [cross]", "check": "Play a full round. The winner shows a tick and the loser shows a sad face."}], "test": ["Press B on one micro:bit. Both show a sleepy face, then a target.", "First to press A shows a tick, and the other shows a sad face.", "Pressing A before the target shows a cross. After that you cannot win that round.", "Play a second round straight away. It should work the same.", "Is it ever a draw? Why might both micro:bits think they won?"], "extend": [{"title": "Scoreboard", "text": "Keep score for each player and show it when the logo is touched (V2) or when A and B are pressed together.", "hint": "Make a variable called wins. Add 1 when you win. Show it with 'show number'."}, {"title": "Best of five", "text": "First to three wins takes the match. Show a special winner display."}, {"title": "Reaction time", "text": "Work out how many milliseconds you took to react and show it after you win.", "hint": "Save 'running time' when the target appears. Subtract it from 'running time' when you press A."}]}, "radio-tennis": {"id": "radio-tennis", "level": 5, "emoji": "🎾", "title": "Radio Tennis", "tagline": "Bat a ball across the air from one micro:bit to the other.", "make": "A tennis game across two micro:bits. The ball is a dot that moves across your screen. When it reaches the edge, press A to hit it. A good hit sends the ball through the air to your partner's screen. Miss the ball and your partner scores. Press B to serve.", "learn": "Games need several things working together: movement, timing, messages and scores. A function keeps the code tidy.", "world": "Every online multiplayer game sends the ball, the score and the 'you missed' message between players like this.", "v2": null, "progs": [["both", "Same program on both micro:bits"]], "steps": [{"title": "Set up the game", "prog": "both", "task": "Join your radio group. Make four variables: score (start at 0), speed (start at 400), hit (false) and hittable (false). Show the score.", "think": ["speed is how many milliseconds the ball spends on each pixel. Smaller means faster.", "hit remembers whether you swung in time. hittable says whether swinging counts right now."], "blocks": ["basic: on start", "radio: radio set group", "vars: make a Variable", "vars: set … to …", "basic: show number"], "pseudo": "basic: on start\n  radio: radio set group [{G}]\n  vars: set [score] to [0]\n  vars: set [speed] to [400]\n  vars: set [hit] to [false]\n  vars: set [hittable] to [false]\n  basic: show number [score]", "check": "Both micro:bits show 0."}, {"title": "Make a function that moves the ball", "prog": "both", "task": "Make a function called rally. Inside, set hit to false, then loop x from 0 to 4. Each time: clear the screen, plot a dot at x in the middle row (y = 2), and pause for speed.", "think": ["Look in Advanced, then Functions, for 'Make a Function'.", "Use 'for index from 0 to 4' in the Loops toolbox and use the index as x. You can rename the variable to x."], "blocks": ["func: make a function rally", "vars: set … to …", "loops: for … from 0 to 4", "basic: clear screen", "led: plot x y", "basic: pause (ms)"], "pseudo": "func: function [rally]\n  vars: set [hit] to [false]\n  loops: for [x] from [0] to [4]\n    basic: clear screen\n    led: plot x [x] y [2]\n    basic: pause (ms) [speed]", "check": "The function is made but nothing calls it yet. Next step serves the ball."}, {"title": "Serve the ball", "prog": "both", "task": "When B is pressed, call rally.", "think": ["After you make a function, you can find it as a block in the Functions toolbox."], "blocks": ["input: on button B pressed", "func: call rally"], "pseudo": "input: on button [B] pressed\n  func: call [rally]", "check": "Press B and the ball moves across your screen."}, {"title": "Open the hit window", "prog": "both", "task": "Inside the loop, when x is 3 or more, set hittable to true. After the loop ends, set hittable to false.", "think": ["The ball is on the last two pixels when x is 3 or 4. That is when the swing counts.", "Check x with 'greater than or equal' (look in the Logic toolbox)."], "blocks": ["logic: if … then", "logic: ≥ (comparison)", "vars: set … to …"], "pseudo": "func: function [rally]\n  vars: set [hit] to [false]\n  loops: for [x] from [0] to [4]\n    basic: clear screen\n    led: plot x [x] y [2]\n    logic: if [x ≥ 3] then\n      vars: set [hittable] to [true]\n    basic: pause (ms) [speed]\n  vars: set [hittable] to [false]", "check": "Nothing different on screen. The window is hidden inside the code."}, {"title": "Swing!", "prog": "both", "task": "When A is pressed, if hittable is true, set hit to true.", "think": ["Pressing A at any other time should do nothing at all."], "blocks": ["input: on button A pressed", "logic: if … then", "vars: set … to …"], "pseudo": "input: on button [A] pressed\n  logic: if [hittable] then\n    vars: set [hit] to [true]", "check": "Nothing visible yet. You will see the effect in the next step."}, {"title": "Send the ball, or miss", "prog": "both", "task": "After the loop and after closing the hit window: if hit is true, send 1 (the ball goes to your partner) and clear the screen. Otherwise send 2 (you missed) and show a sad face.", "think": ["Two different messages: 1 means 'here comes the ball', 2 means 'I missed, you score'."], "blocks": ["logic: if … then … else", "radio: radio send number", "basic: clear screen", "basic: show icon"], "pseudo": "func: function [rally]\n  (set hit to false, the loop, set hittable to false)\n  logic: if [hit] then\n    radio: radio send number [1]\n    basic: clear screen\n  logic: else\n    radio: radio send number [2]\n    basic: show icon [sad face]", "check": "Serve and hit the ball. It disappears from your screen."}, {"title": "Receive the ball and the points", "prog": "both", "task": "When a number arrives: if it is 1, call rally (the ball is on your side now). If it is 2, add 1 to score, show a happy face for one second, then show the score.", "think": ["The ball arriving and a point arriving are two different messages. You need an if with an else if.", "The same function does the work for serving and for returning."], "blocks": ["radio: on radio received receivedNumber", "logic: if … then … else if", "func: call rally", "vars: change … by …", "basic: show icon", "basic: pause (ms)", "basic: show number"], "pseudo": "radio: on radio received [receivedNumber]\n  logic: if [receivedNumber = 1] then\n    func: call [rally]\n  logic: else if [receivedNumber = 2] then\n    vars: change [score] by [1]\n    basic: show icon [happy face]\n    basic: pause (ms) [1000]\n    basic: show number [score]", "check": "Play a full rally. The ball travels back and forth, and misses score points."}], "test": ["Press B to serve and the ball moves across your screen.", "Pressing A as the ball reaches the edge sends it to your partner.", "Pressing A too early does nothing, and the ball is a miss.", "Missing the ball gives your partner a point.", "Rule: the player who missed serves next. Play to 5 points."], "extend": [{"title": "Faster and faster", "text": "Make the ball speed up after every good hit, but never get faster than 100 milliseconds per pixel.", "hint": "Subtract from speed after each successful hit. Use 'maximum' from Math so it never drops below 100."}, {"title": "First to five", "text": "When someone reaches 5 points, show a winner message and stop the game."}, {"title": "Moving ball", "text": "Make the ball start on a random row so you have to follow it with your eyes.", "hint": "Make a variable called row, set it to a random number from 0 to 4 at the start of rally, and use it for y."}, {"title": "Sound effects", "text": "Add a sound for a hit, a miss and a point. Sound needs a V2 micro:bit."}]}}, "enc": {"signal-meter": "Pj5bCVYKRlgWBkNIVCFPFR0UAxc
