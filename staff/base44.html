<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Staff</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>:root{--navy:#0D203B;--card:#16294A;--pink:#EE3181;--orange:#F79532;--blue:#1A97CD;--muted:#9FB0C6}
*{box-sizing:border-box}body{margin:0;background:var(--navy);color:#fff;font-family:Nunito,Arial,sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
h1{font-family:'Nunito Sans',Arial,sans-serif;font-size:30px;margin:8px 0 4px}h2{font-size:24px;margin:0 0 8px}h3{font-size:14px;margin:0 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.tag{display:inline-block;background:var(--pink);font-weight:800;font-size:13px;border-radius:99px;padding:3px 12px;letter-spacing:1px}
.card{background:var(--card);border-radius:14px;padding:18px 22px;margin:16px 0}ol{margin:0;padding-left:22px}li{margin:6px 0}
.keyrow{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}code{font-family:Consolas,monospace;background:#0D203B;padding:2px 8px;border-radius:6px}code.big{font-size:22px;display:inline-block;margin:2px 0 6px}
.cp,.open{font:700 14px Nunito,Arial,sans-serif;color:#fff;background:transparent;border:2px solid var(--pink);border-radius:99px;padding:4px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.cp.done{background:var(--pink)}.meta{color:var(--muted);font-size:14px}small{color:var(--muted);word-break:break-all}
nav.rooms{position:sticky;top:0;background:var(--navy);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;z-index:5;border-bottom:1px solid #2a4066}nav.rooms a{color:#fff;background:#1C3157;border-radius:8px;padding:6px 14px;text-decoration:none;font-weight:700}
.room{margin:28px 0;scroll-margin-top:70px}.who{background:var(--orange);color:var(--navy);border-radius:99px;font-size:16px;padding:2px 14px;margin-left:8px;vertical-align:middle}.rng{color:var(--muted);margin:0 0 8px}
.reserve .who{background:var(--muted)}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}th,td{padding:8px 12px;text-align:left;vertical-align:middle}th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;background:#1C3157}tr+tr td{border-top:1px solid #2a4066}td.g{font-size:22px;font-weight:800;width:70px}
img.qr{background:#fff;border-radius:6px;display:block}
#gate{max-width:380px;margin:18vh auto;text-align:center}#gate input{font:700 20px Nunito,Arial;padding:10px 14px;border-radius:10px;border:2px solid #2a4066;background:#16294A;color:#fff;width:100%;text-align:center;letter-spacing:4px;text-transform:uppercase}
#gate button{margin-top:12px;font:800 16px Nunito,Arial;background:var(--pink);color:#fff;border:0;border-radius:99px;padding:10px 28px;cursor:pointer}#err{color:var(--orange);min-height:24px;margin-top:8px}
@media(max-width:640px){td.g{font-size:18px;width:44px}th,td{padding:6px}.keyrow{gap:16px}}
@media print{nav.rooms{display:none}body{background:#fff;color:#000}.card,table{background:#fff}}
</style></head><body>
